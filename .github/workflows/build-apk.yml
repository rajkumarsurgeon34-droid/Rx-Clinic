name: Build APK
# On every push: only checks that the app code compiles (no APK).
# To make the APK: Actions → Build APK → Run workflow.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "server/**"
      - "wrangler.toml"
      - "package.json"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -sSLo /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SM" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"

      - name: Use the fixed signing key (so updates install over old versions)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build APK
# On every push: only checks that the app code compiles (no APK).
# To make the APK: Actions → Build APK → Run workflow.
        env:
          # Optional: add a repository variable RX_CLINIC_SERVER_URL so the app
          # comes pre-filled with your Rx Clinic server address.
          RX_CLINIC_SERVER_URL: ${{ vars.RX_CLINIC_SERVER_URL }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        if: github.event_name == 'workflow_dispatch'
        run: cp app/build/outputs/apk/debug/app-debug.apk Rx-Clinic.apk

      - uses: actions/upload-artifact@v5
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Rx-Clinic.apk
          path: Rx-Clinic.apk

      - name: Publish download (Releases)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Rx Clinic build ${{ github.run_number }}
          body: Install Rx-Clinic.apk on your Android phone.
          files: Rx-Clinic.apk
